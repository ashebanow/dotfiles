# Taken from https://github.com/omerxx/dotfiles/blob/master/tmux/tmux.conf
#
# Plugin manager removed (BOX-210). This file used TPM, which cannot work under
# nix: it clones plugins into ~/.config/tmux/plugins, and on NixOS the packages
# come from the store, so that is not a directory a plugin manager may write to.
# The @plugin lines and the plugin-only @-settings that went with them
# (catppuccin, sessionx, floax, resurrect/continuum, fzf-url) are gone, leaving
# a self-contained config that works on any host. If that layer is ever wanted
# back, the nix-native route is programs.tmux.plugins with pkgs.tmuxPlugins.*
# — nixpkgs carries most of them under tmux-* names (tmux-sessionx,
# tmux-floax, tmux-thumbs, catppuccin, …) — rather than TPM.
#
# One dangling reference went with it: the catppuccin status line pointed at
# ~/.config/tmux/scripts/cal.sh, which has never existed in this repo.

source-file ~/.config/tmux/tmux.reset.conf

set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

set -g prefix ^A
set -g base-index 1              # start indexing windows at 1 instead of 0
setw -g pane-base-index 1        # start indexing panes at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 100000      # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g default-terminal "${TERM}"
setw -g mode-keys vi
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
