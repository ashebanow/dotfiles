default_key_modifier = "ctrl-alt"
show_cheatsheet_on_modifier_hold = true

[layout]
default_column_width = 1.0
preset_column_widths = [0.33, 0.50, 0.66, 0.80]
center_focused_column = "on-overflow"
always_center_single_column = true
gaps = 6
# reserved_top = 0
# reserved_bottom = 0

[workspaces]
names = ["dev", "web", "tools"]
default = "dev"
# monitors = { tools = 2 }

[menu_bar]
enabled = true

[animation]
enabled = true

[overview]
# zoom = 0.5
# window_previews = false
# window_corner_radius = 12

[decorations.borders]
# enabled = true
# width = 4
# color = "#FFC099FF"
# inactive_enabled = false
# inactive_color = "#66C099FF"
# capture_enabled = false
# placement = "outside"

