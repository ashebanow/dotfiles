# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling

# don't use file watching/shell hook for devenv cd/reload, and don't prepend
# (devenv) to prompt since starship takes care of this.
reload: false
prompt_prefix: false

shell: zsh

# There is deliberately NO `secretspec:` block here. Enabling the integration
# makes devenv invoke secretspec during `devenv shell` evaluation on every `cd`
# into this repo:
#   - On headless NixOS (lumquat), the operator's shell has no BWS_ACCESS_TOKEN
#     (per SECRET_SYNC.md and ADR 0001, the bootstrap token at
#     /var/lib/secrets/bws-access-token is root-only and delivered only to
#     systemd units via LoadCredential), so auto-activation fails with
#     "BWS access_token credential is not set".
#   - Under Warp or agent harnesses, SecretSpec's `require_reason` policy
#     rejects the hook's evaluation because `devenv shell` has no `--reason`
#     flag.
#
# The integration was only ever here for devenv's built-in Cachix secret, and
# that token is already provisioned at ~/.config/cachix/cachix.dhall by
# `chezmoi apply` (via `bitwardenSecrets`, which on lumquat runs under
# `home-manager-podman.service` with `LoadCredential`). devenv's native
# fallback reads ~/.config/cachix/cachix.dhall directly without invoking
# secretspec or BWS at shell entry.

# secretspec:
#   enable: true
#   cachix_auth_token: true

# If you're using non-OSS software, you can set allow_unfree to true.
allow_unfree: true

# If you're not willing to allow unsupported packages:
# allow_unsupported_system: false

# If you're willing to use a package that's vulnerable
# permitted_insecure_packages:
#  - "openssl-1.1.1w"

# If you have more than one devenv you can merge them
#imports:
# - ./backend
